name: Validate Haru migration
on:
  push:
    branches: [migration/stack]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'uzoom333/HaruSite-migration'
    runs-on: ubuntu-latest
    # O SQLite é um arquivo: não há serviço de banco para subir nem esperar ficar saudável.
    env:
      DATABASE_FILE: .local/haru.db
      TEST_DATABASE_FILE: .local/haru_test.db
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      # npm test cria e migra o banco de testes antes de executar a suíte da API.
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
# Next.js + NestJS precisam de runtime Node; GitHub Pages não executa esta stack.
# Este workflow valida apenas o fork. Nenhum deploy ou push para o original é realizado.
